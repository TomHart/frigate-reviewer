; Production PHP settings for the container image. Placed in conf.d so it
; overrides php.ini-production. Code inside the image is immutable, so the
; opcode cache never needs to revalidate.
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
date.timezone = UTC
expose_php = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16

[sqlite]
sqlite3.defensive = 1
