framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        missing_import_mode: strict
        # The Tailwind *input* stylesheet is a build-time source (compiled by
        # the standalone Tailwind CLI, see composer "compile:css"); only the
        # compiled output (styles/app.built.css) is mapped.
        excluded_patterns:
            - '**/tailwind.input.css'

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
