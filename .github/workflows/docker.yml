# Build the Frigate Review image and push it to the private registry.
#
# Required repository secrets:
#   DOCKER_REGISTRY_HOST — full image reference including the registry host,
#       e.g. "registry.example.com/tom/frigate-review" or, when the image
#       lives at the registry root, "registry.example.com:5000/frigate-review".
#       The login step uses the part before the first "/" as the registry host.
#   DOCKER_REGISTRY_USER — registry username.
#   DOCKER_REGISTRY_PASS — registry password or access token.

name: Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    # Doc/spec-only changes never affect the image, so don't burn a build.
    paths-ignore:
      - 'openspec/**'
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
      - 'LICENSE'
  workflow_dispatch:

# Rapid pushes to the same ref supersede each other; cancel the stale run.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKER_REGISTRY_HOST }}

jobs:
  # Gate the image build on a green PHPUnit suite. Tests use in-memory
  # SQLite, so no database service container is needed.
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, gd, intl
          coverage: none

      # .env is gitignored, but symfony/runtime's bootEnv() throws a
      # PathException without it — both for composer's auto-scripts and for
      # tests/bootstrap.php. Test DB is pinned to in-memory SQLite by
      # config/packages/test/doctrine.yaml, so these values are placeholders.
      - name: Create .env
        run: printf 'APP_ENV=test\nAPP_SECRET=test-secret\nDATABASE_URL=sqlite:///:memory:\n' > .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit test suite
        run: vendor/bin/phpunit

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up QEMU (arm64 image builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the private registry
        env:
          REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASS }}
        run: |
          registry="${IMAGE%%/*}"
          echo "Logging in to ${registry}"
          echo "${REGISTRY_PASSWORD}" | docker login "${registry}" --username "${REGISTRY_USER}" --password-stdin

      - name: Determine image tags
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # Moving tag for the default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # v1.2.3 -> 1.2.3 and 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Exact commit the image was built from
            type=sha

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PHP_VERSION=8.4
            TAILWIND_VERSION=4.3.5
